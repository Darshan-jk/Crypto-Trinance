<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Trinance</title>
    <link rel="stylesheet" href="styles/signup.css">
    <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <div class="container">
        <div class="logo">
        <img src="images/logo.png" alt=""><h1>Trinance</h1>
        </div>
        <h1>Create Your Crypto Account</h1>
        <p class="subtitle">Trade Bitcoin, Ethereum & more securely.</p>
     <form>

            <label for="fullname">Full Name</label>
            <input type="text" id="fullname"
            placeholder="Enter your full name" required>

            <label for="username">Username</label>
            <input type="text" id="username"
            placeholder="Choose a username" required>

            <label for="email">Email Address</label>
            <input type="email" id="email"
            placeholder="Enter your email" required>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone"
            placeholder="+91 9123456789" required>

            <label for="country">Country</label>
            <select id="country" required>
                <option value="">Select Country</option>
                <option>India</option>
                <option>United States</option>
                <option>United Kingdom</option>
                <option>Canada</option>
                <option>Australia</option>
            </select>

            <label for="password">Password</label>
            <input type="password" id="password"
            placeholder="Create a strong password" required>

            <label for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password"
            placeholder="Confirm your password" required>

            <div class="terms">
                <input type="checkbox" id="terms" required>
                <label for="terms">
                    I agree to the Terms & Conditions
                </label>
            </div>
            <br>

            <button type="submit" class="signup-btn" onclick="location.href='dashboard.html'">Create Account</button>

            <div class="login-options">
                <p>or</p>
            </div>

            <div class="social-login">

                <button type="button" class="social-btn google">
                    <i class="fab fa-google"></i>
                    Continue with Google
                </button>

                <button type="button" class="social-btn apple">
                    <i class="fab fa-apple"></i>
                    Continue with Apple
                </button>

                <button type="button" class="social-btn telegram">
                    <i class="fab fa-telegram"></i>
                    Continue with Telegram
                </button>

            </div>

        </form>
    </div>

    <div class="register">
            <p>
                Already have an account?
                <a class="register" href="login.html">Login</a>
            </p>
        </div>

    <footer>
        <p>&copy; 2026 Trinance. All rights reserved.</p>
    </footer>
    
</body>
</html>
